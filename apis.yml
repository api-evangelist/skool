name: Skool
kind: company
description: >-
  Skool is an all-in-one community platform that combines discussion communities,
  online courses, live calls, and gamification in a single product, founded by
  Sam Ovens and popularized in partnership with Alex Hormozi. As of this review,
  Skool does NOT publish an official public or partner developer REST API. The
  only official programmatic surface is a Zapier integration, gated to the paid
  Pro plan, that exposes a small set of triggers and actions via a per-group API
  key used solely to link a Skool group to Zapier - it is not a general-purpose
  developer API. All broader "Skool API" offerings found in the wild (Apify
  actors, docs.skoolapi.com, reverse-engineered clients, Chrome extensions) are
  unofficial third-party tools built on Skool's undocumented internal endpoints
  and are not endorsed or supported by Skool. This catalog entry is an honest
  gated stub: no public API surface is modeled because none is documented.
