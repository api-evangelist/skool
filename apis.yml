apis:
- aid: skool:skool-zapier-integration
  name: Skool Zapier Integration
  tags:
  - Zapier
  - Automation
  - Integration
  - Pro Plan
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://help.skool.com/article/56-zapier-integration
  properties:
  - url: https://help.skool.com/article/56-zapier-integration
    type: Documentation
  - url: https://zapier.com/apps/skool/integrations
    type: Integrations
  description: >-
    Skool's only official programmatic surface. This is a Zapier-mediated
    automation integration, not a public REST API. It is available on the paid
    Pro plan only (not Hobby) and is enabled via a per-group API key found under
    the group's Plugins settings; refreshing that key breaks all existing Zaps.
    The integration exposes a small, fixed set of capabilities - triggers to send
    paid members' names and emails, and membership-question answers, to another
    app (e.g. a CRM), and actions to invite a member to a group and to unlock a
    course for a member. No base URL, endpoint reference, OpenAPI, or general
    CRUD surface is published by Skool; there are no modeled endpoints because
    none are documented (endpointsModeled: false).
